// Ветка `mediation` — сборка для Google Play с медиацией «Простой монетизации»
// Яндекса (РСЯ app 19778191). Ветка `main` остаётся чистым Yandex SDK и
// используется RuStore-билдом: тащить туда Google Mobile Ads не нужно и вредно
// (лишний вес + GMA падает без com.google.android.gms.ads.APPLICATION_ID).
//
// Инструкция Яндекса: ads.yandex.com/helpcenter/ru/easy/integration/android/
// Подключаем рекомендованный сборный артефакт com.yandex.android:mobileads-mediation:
// он тянет Yandex SDK и адаптеры всех сетей водопада. Ключи/ID сетей приходят
// с сервера Яндекса, кроме AdMob App ID — он берётся из meta-data
// com.google.android.gms.ads.APPLICATION_ID в манифесте игры. Без адаптеров
// аукцион видит только РСЯ и AdMob, даже если сети включены в кабинете.
//
// Адаптер Google в наборе — next-gen: тянет Google Mobile Ads SDK нового
// поколения (ads-mobile-sdk) из репозитория Google, поэтому нужен google().
// Требует minSdk 24 — он поднят в platforms/googleplay/settings.ini игры.

android {
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

repositories {
    mavenCentral()
    google()   // com.google.android.libraries.ads.mobile.sdk:ads-mobile-sdk

    // Сети, которых нет в mavenCentral.
    maven { url 'https://artifact.bytedance.com/repository/pangle' }                          // Pangle
    maven { url 'https://sdk.tapjoy.com/' }                                                   // Digital Turbine (Tapjoy)
    maven { url 'https://dl-maven-android.mintegral.com/repository/mbridge_android_sdk_oversea' } // Mintegral
    maven { url 'https://cboost.jfrog.io/artifactory/chartboost-ads/' }                       // Chartboost
    maven { url 'https://dl.appnext.com/' }                                                   // AppNext
    maven { url 'https://artifactory.bidmachine.io/bidmachine' }                              // BidMachine (mobileads-extras)
}

dependencies {
    implementation 'com.yandex.android:mobileads-mediation:8.6.0.0'
}
